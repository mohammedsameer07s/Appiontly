services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appointly
      POSTGRES_USER: appointly_local
      POSTGRES_PASSWORD: appointly_local
    ports:
      - "5432:5432"
    volumes:
      - appointly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointly_local -d appointly"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: appointly_test
      POSTGRES_USER: appointly_test
      POSTGRES_PASSWORD: appointly_test_local_only
    ports:
      - "5433:5432"
    volumes:
      - appointly-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointly_test -d appointly_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  appointly-postgres:
  appointly-test-postgres:
